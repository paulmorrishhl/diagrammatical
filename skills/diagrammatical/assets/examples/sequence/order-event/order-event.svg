<svg id="order-event-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="order-event-title order-event-desc"><title id="order-event-title">Order event fan-out sequence</title><desc id="order-event-desc">Checkout publishes an order event to the Event broker. Reading downward, the broker acknowledges publication and independently delivers the event to Fulfilment and Notification workers, which perform self-directed work and acknowledge delivery.</desc><defs><style>:root{--canvas:#f7f5ef;--surface:#fff;--surface-secondary:#f0eee8;--ink:#20242c;--ink-muted:#687083;--rule:#d8d4ca;--connector:#697386;--emphasis-primary:#315be8;--emphasis-primary-tint:#e7ecff;--emphasis-secondary:#19735e;--external:#2767b0;--success:#19735e;--warning:#b86514;--danger:#b83a42;--deprecated:#9a6427}.t{font:38px Georgia;fill:var(--ink)}.s{font:15px Arial;fill:var(--ink-muted)}.p{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.pf{fill:var(--emphasis-primary-tint);stroke:var(--emphasis-primary);stroke-width:2}.l{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:5 5}.a{stroke:var(--external);stroke-width:2;marker-end:url(#order-event-open)}.r{stroke:var(--connector);stroke-width:2;stroke-dasharray:7 5;marker-end:url(#order-event-return)}.n{font:600 14px Arial;fill:var(--ink);text-anchor:middle}.x{font:13px Arial;fill:var(--ink)}</style><marker id="order-event-open" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--external)" stroke-width="1.5"/></marker><marker id="order-event-return" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--connector)"/></marker></defs><rect width="1200" height="800" fill="var(--canvas)"/><text x="56" y="62" class="t">Order event fan-out</text><text x="56" y="91" class="s">Open arrowheads expose asynchronous delivery to independent consumers.</text><g><rect x="60" y="125" width="180" height="58" rx="6" class="p"/><text x="150" y="160" class="n">Checkout</text><rect x="350" y="125" width="190" height="58" rx="6" class="pf"/><text x="445" y="160" class="n">Event broker</text><rect x="655" y="125" width="190" height="58" rx="6" class="p"/><text x="750" y="160" class="n">Fulfilment worker</text><rect x="950" y="125" width="190" height="58" rx="6" class="p"/><text x="1045" y="160" class="n">Notification worker</text><path d="M150 183V720M445 183V720M750 183V720M1045 183V720" class="l"/></g><path d="M150 235H445" class="a" data-emphasis="primary"/><text x="250" y="226" class="x">1 · Order placed event · Async</text><path d="M445 290H150" class="r"/><text x="260" y="281" class="x">2 · Accepted</text><path d="M445 355H750" class="a"/><text x="555" y="346" class="x">3 · Deliver order event</text><path d="M750 410h85v45h-85" fill="none" class="a"/><text x="850" y="438" class="x">4 · Create shipment</text><path d="M750 490H445" class="r"/><text x="560" y="481" class="x">5 · Acknowledge</text><path d="M445 555H1045" class="a"/><text x="700" y="546" class="x">6 · Deliver order event</text><path d="M1045 610h80v45h-80" fill="none" class="a"/><text x="910" y="638" class="x">7 · Send confirmation</text><path d="M1045 690H445" class="r"/><text x="720" y="681" class="x">8 · Acknowledge</text><text x="56" y="760" class="s">Solid open arrows = async/event · dashed open arrows = acknowledgement return</text></svg>
