<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Care coordination domains</title>
</head>
<body style="margin:0;background:#f7f5ef">
<svg id="care-coordination-domains-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="care-coordination-domains-title care-coordination-domains-desc">
  <title id="care-coordination-domains-title">Care coordination domains</title>
  <desc id="care-coordination-domains-desc">A patient enters through the access and consent domain, verified requests move to care delivery, and governed updates cross into clinical records while laboratory results remain an external contract.</desc>
  <defs>
    <style>
      :root { --canvas:#f7f5ef; --surface:#ffffff; --surface-secondary:#f0eee8; --ink:#20242c; --ink-muted:#687083; --rule:#d8d4ca; --connector:#697386; --emphasis-primary:#315be8; --emphasis-primary-tint:#e7ecff; --emphasis-secondary:#19735e; --external:#2767b0; }
      text { fill:var(--ink); font-family:Inter,Arial,sans-serif; }
      .title { font-family:"Instrument Serif",Georgia,serif; font-size:42px; font-weight:400; }
      .subtitle { fill:var(--ink-muted); font-size:16px; }
      .eyebrow,.meta,.group-label,.external-tag { font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:1px; }
      .eyebrow { fill:var(--emphasis-primary); font-weight:600; }
      .group-box { fill:var(--surface-secondary); fill-opacity:.5; stroke:var(--connector); stroke-width:1.2; }
      .group-cap { fill:var(--surface-secondary); stroke:var(--connector); stroke-width:1.2; }
      .group-label { font-weight:600; }
      .node { fill:var(--surface); stroke:var(--rule); stroke-width:1.3; }
      .node-focal { fill:var(--emphasis-primary-tint); stroke:var(--emphasis-primary); stroke-width:2; }
      .node-external { fill:var(--surface); stroke:var(--external); stroke-width:1.8; stroke-dasharray:6 4; }
      .node-label { font-size:16px; font-weight:650; }
      .node-detail { fill:var(--ink-muted); font-size:12px; }
      .responsibility { fill:var(--emphasis-secondary); font-size:12px; font-weight:650; }
      .external-tag { fill:var(--external); font-weight:600; }
      .connector { fill:none; stroke:var(--connector); stroke-width:2; }
      .connector-primary { fill:none; stroke:var(--emphasis-primary); stroke-width:2.5; }
      .connector-external { fill:none; stroke:var(--external); stroke-width:2; stroke-dasharray:7 6; }
      .edge-label { fill:var(--ink-muted); font-size:12px; }
    </style>
    <marker id="care-coordination-domains-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--connector)" stroke-width="1.5"/>
    </marker>
    <marker id="care-coordination-domains-arrow-primary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--emphasis-primary)" stroke-width="1.5"/>
    </marker>
    <marker id="care-coordination-domains-arrow-external" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--external)" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="var(--canvas)"/>
  <text x="54" y="54" class="eyebrow">ARCHITECTURE / BOUNDED DOMAINS / CLINICAL</text>
  <text x="54" y="107" class="title">Care coordination domains</text>
  <text x="54" y="139" class="subtitle">Clear responsibility boundaries keep access, clinical work, and governed records independently accountable.</text>

  <g id="care-coordination-domains-access-group" data-group-id="access-domain">
    <rect x="45" y="268" width="330" height="398" rx="6" class="group-box"/>
    <rect x="45" y="268" width="330" height="52" rx="6" class="group-cap"/>
    <text x="67" y="300" class="group-label">01 · ACCESS + CONSENT</text>
  </g>
  <g id="care-coordination-domains-care-group" data-group-id="care-domain">
    <rect x="435" y="268" width="330" height="398" rx="6" class="group-box"/>
    <rect x="435" y="268" width="330" height="52" rx="6" class="group-cap"/>
    <text x="457" y="300" class="group-label">02 · CARE DELIVERY</text>
  </g>
  <g id="care-coordination-domains-records-group" data-group-id="records-domain">
    <rect x="825" y="268" width="330" height="398" rx="6" class="group-box"/>
    <rect x="825" y="268" width="330" height="52" rx="6" class="group-cap"/>
    <text x="847" y="300" class="group-label">03 · CLINICAL RECORDS</text>
  </g>

  <g id="care-coordination-domains-connectors">
    <path d="M174 228 V346" class="connector" marker-end="url(#care-coordination-domains-arrow)"/>
    <text x="188" y="254" class="edge-label">intake + status</text>
    <path d="M210 428 V496" class="connector" marker-end="url(#care-coordination-domains-arrow)"/>
    <path d="M310 537 H404 V390 H470" class="connector-primary" marker-end="url(#care-coordination-domains-arrow-primary)"/>
    <text x="318" y="522" class="edge-label">verified request</text>
    <path d="M600 450 V496" class="connector" marker-end="url(#care-coordination-domains-arrow)"/>
    <path d="M730 382 H860" class="connector-primary" marker-end="url(#care-coordination-domains-arrow-primary)"/>
    <text x="746" y="366" class="edge-label">governed update</text>
    <path d="M990 428 V496" class="connector" marker-end="url(#care-coordination-domains-arrow)"/>
    <path d="M912 228 H790 V430 H730" class="connector-external" marker-end="url(#care-coordination-domains-arrow-external)"/>
    <text x="796" y="414" class="edge-label">lab result</text>
  </g>

  <g id="care-coordination-domains-patient" data-node-id="patient" data-kind="actor">
    <path d="M78 172 H270 L288 200 L270 228 H78 L60 200 Z" class="node"/>
    <text x="100" y="195" class="node-label">Patient</text>
    <text x="100" y="216" class="node-detail">Initiates and reviews care</text>
  </g>
  <g id="care-coordination-domains-laboratory" data-node-id="laboratory-network" data-kind="external-service">
    <rect x="912" y="166" width="238" height="62" rx="5" class="node-external"/>
    <text x="932" y="188" class="external-tag">EXTERNAL CONTRACT</text>
    <text x="932" y="214" class="node-label">Laboratory network</text>
  </g>
  <g id="care-coordination-domains-portal" data-node-id="patient-portal" data-kind="service">
    <rect x="80" y="346" width="230" height="82" rx="5" class="node"/>
    <text x="104" y="379" class="node-label">Patient portal</text>
    <text x="104" y="404" class="responsibility">INTAKE + STATUS</text>
  </g>
  <g id="care-coordination-domains-identity" data-node-id="identity-service" data-kind="service">
    <rect x="80" y="496" width="230" height="82" rx="5" class="node"/>
    <text x="104" y="529" class="node-label">Identity service</text>
    <text x="104" y="554" class="responsibility">IDENTITY + CONSENT</text>
  </g>
  <g id="care-coordination-domains-coordinator" data-node-id="care-coordinator" data-kind="service" data-emphasis="primary">
    <rect x="470" y="340" width="260" height="110" rx="5" class="node-focal"/>
    <text x="496" y="378" class="node-label">Care coordinator</text>
    <text x="496" y="405" class="responsibility">ROUTE CLINICAL WORK</text>
    <text x="496" y="429" class="node-detail">Primary responsibility boundary</text>
  </g>
  <g id="care-coordination-domains-clinician" data-node-id="clinician-workspace" data-kind="actor">
    <path d="M490 496 H710 L730 537 L710 578 H490 L470 537 Z" class="node"/>
    <text x="504" y="531" class="node-label">Clinician workspace</text>
    <text x="504" y="556" class="responsibility">REVIEW + ACT</text>
  </g>
  <g id="care-coordination-domains-record" data-node-id="patient-record" data-kind="data-store">
    <path d="M860 354 C860 336 1120 336 1120 354 V410 C1120 428 860 428 860 410 Z" class="node"/>
    <path d="M860 354 C860 372 1120 372 1120 354" fill="none" stroke="var(--rule)"/>
    <text x="890" y="386" class="node-label">Patient record</text>
    <text x="890" y="409" class="responsibility">GOVERNED CLINICAL STATE</text>
  </g>
  <g id="care-coordination-domains-audit" data-node-id="audit-service" data-kind="service">
    <rect x="860" y="496" width="260" height="82" rx="5" class="node"/>
    <text x="890" y="529" class="node-label">Audit service</text>
    <text x="890" y="554" class="responsibility">IMMUTABLE ACCESS TRAIL</text>
  </g>

  <line x1="54" y1="716" x2="1146" y2="716" stroke="var(--rule)"/>
  <text x="54" y="744" class="meta" fill="var(--ink-muted)">EDITORIAL BLUEPRINT · CLINICAL · DOMAIN CAPS + RESPONSIBILITY LABELS + DASHED EXTERNAL CONTRACT</text>
</svg>
</body>
</html>
