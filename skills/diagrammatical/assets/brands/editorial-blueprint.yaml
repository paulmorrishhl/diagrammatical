  light:
    palette:
      warmPaper: "#F7F5EF"
      white: "#FFFFFF"
      paperGrey: "#F0EEE8"
      graphite: "#20242C"
      slate: "#687083"
      hairline: "#D8D4CA"
      connectorSlate: "#697386"
      cobalt: "#315BE8"
      cobaltTint: "#E7ECFF"
      green: "#19735E"
      blue: "#2767B0"
      amber: "#B86514"
      red: "#B83A42"
      ochre: "#9A6427"
    roles:
      canvas: "#F7F5EF"
      surface: "#FFFFFF"
      surfaceSecondary: "#F0EEE8"
      ink: "#20242C"
      inkMuted: "#687083"
      rule: "#D8D4CA"
      connector: "#697386"
      emphasisPrimary: "#315BE8"
      emphasisPrimaryTint: "#E7ECFF"
      emphasisSecondary: "#19735E"
      external: "#2767B0"
      success: "#19735E"
      warning: "#B86514"
      danger: "#B83A42"
      deprecated: "#9A6427"
  dark:
    palette:
      night: "#171A21"
      graphite: "#20242C"
      raisedGraphite: "#292E38"
      paper: "#F4F1E9"
