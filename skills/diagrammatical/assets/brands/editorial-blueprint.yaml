schemaVersion: 1
id: editorial-blueprint
name: Editorial Blueprint
description: Warm editorial restraint with near-black structure, cobalt emphasis, and quiet technical precision.

typography:
  heading:
    family: Instrument Serif
    fallbacks: [Georgia, serif]
    weight: 400
  body:
    family: Inter
    fallbacks: [Arial, sans-serif]
    weight: 400
  label:
    family: Inter
    fallbacks: [Arial, sans-serif]
    weight: 600
  technical:
    family: IBM Plex Mono
    fallbacks: [monospace]
    weight: 400

logo:
  source: null
  placements: []

shape:
  cornerCharacter: small
  radius: 6
  nodePadding: 16
  maxNodeWidth: 280

stroke:
  borderWidth: 1
  ruleWidth: 1

connectors:
  weight: 2
  curvature: orthogonal
  arrowhead: line

icons:
  family: geometric-line
  customDirectory: null

density: generous

accessibility:
  normalTextContrast: 4.5
  largeTextContrast: 3.0
  allowDerivedColours: false
  statusRequiresNonColourCue: true

