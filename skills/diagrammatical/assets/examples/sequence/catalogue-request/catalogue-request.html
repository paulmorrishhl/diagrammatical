<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>catalogue request</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef}svg{display:block;width:100%;height:auto}</style></head><body>
<svg id="catalogue-request-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="catalogue-request-title catalogue-request-desc">
<title id="catalogue-request-title">Catalogue request sequence</title><desc id="catalogue-request-desc">From left to right the Browser calls the Storefront API, which checks the Product cache, fetches a missing product from the Catalogue service, stores it, and returns the product response. Messages read from top to bottom.</desc>
<defs><style>:root{--canvas:#f7f5ef;--surface:#fff;--surface-secondary:#f0eee8;--ink:#20242c;--ink-muted:#687083;--rule:#d8d4ca;--connector:#697386;--emphasis-primary:#315be8;--emphasis-primary-tint:#e7ecff;--emphasis-secondary:#19735e;--external:#2767b0;--success:#19735e;--warning:#b86514;--danger:#b83a42;--deprecated:#9a6427}.t{font:38px Georgia;fill:var(--ink)}.s{font:15px Arial;fill:var(--ink-muted)}.p{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.pf{fill:var(--emphasis-primary-tint);stroke:var(--emphasis-primary);stroke-width:2}.l{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:5 5}.m{stroke:var(--connector);stroke-width:2;marker-end:url(#catalogue-request-arrow)}.r{stroke:var(--connector);stroke-width:2;stroke-dasharray:7 5;marker-end:url(#catalogue-request-open)}.n{font:600 14px Arial;fill:var(--ink);text-anchor:middle}.x{font:13px Arial;fill:var(--ink)}</style><marker id="catalogue-request-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--connector)"/></marker><marker id="catalogue-request-open" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--connector)"/></marker></defs>
<rect width="1200" height="780" fill="var(--canvas)"/><text x="56" y="62" class="t">Catalogue request</text><text x="56" y="91" class="s">A nested request resolves a cache miss without losing chronological order.</text>
<g><rect x="70" y="130" width="180" height="58" rx="6" class="p"/><text x="160" y="165" class="n">Browser</text><rect x="345" y="130" width="190" height="58" rx="6" class="pf"/><text x="440" y="165" class="n">Storefront API</text><rect x="650" y="130" width="180" height="58" rx="6" class="p"/><text x="740" y="165" class="n">Product cache</text><rect x="935" y="130" width="200" height="58" rx="6" class="p"/><text x="1035" y="165" class="n">Catalogue service</text><path d="M160 188V714M440 188V714M740 188V714M1035 188V714" class="l"/><rect x="434" y="224" width="12" height="430" fill="var(--emphasis-primary-tint)" stroke="var(--emphasis-primary)"/></g>
<path d="M160 240H440" class="m"/><text x="270" y="231" class="x">1 · GET product</text><path d="M440 300H740" class="m"/><text x="560" y="291" class="x">2 · Read cache</text><path d="M740 360H440" class="r"/><text x="560" y="351" class="x">3 · Cache miss</text><path d="M440 430H1035" class="m" data-emphasis="primary"/><text x="690" y="421" class="x">4 · Fetch product</text><path d="M1035 500H440" class="r"/><text x="690" y="491" class="x">5 · Product record</text><path d="M440 565H740" class="m"/><text x="560" y="556" class="x">6 · Store result</text><path d="M440 635H160" class="r"/><text x="270" y="626" class="x">7 · 200 product</text><text x="56" y="748" class="s">Solid filled arrows = synchronous request · dashed open arrows = return</text>
</svg>
</body></html>
