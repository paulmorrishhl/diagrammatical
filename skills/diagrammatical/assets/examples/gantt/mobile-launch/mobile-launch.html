<svg id="mobile-launch-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="mobile-launch-title mobile-launch-desc"><title id="mobile-launch-title">Mobile launch phased plan</title><desc id="mobile-launch-desc">An inclusive weekly timeline runs from 1 September through 30 October 2026. Discovery tasks lead to application build and acceptance testing, followed by store review and the Public launch milestone on 30 October.</desc><defs><style>:root{--canvas:#f7f5ef;--surface:#fff;--surface-secondary:#f0eee8;--ink:#20242c;--ink-muted:#687083;--rule:#d8d4ca;--connector:#697386;--emphasis-primary:#315be8;--emphasis-primary-tint:#e7ecff;--emphasis-secondary:#19735e;--external:#2767b0;--success:#19735e;--warning:#b86514;--danger:#b83a42;--deprecated:#9a6427}.t{font:38px Georgia;fill:var(--ink)}.s{font:13px Arial;fill:var(--ink-muted)}.l{font:600 14px Arial;fill:var(--ink)}.grid{stroke:var(--rule);stroke-width:1}.bar{fill:var(--connector)}.done{fill:var(--success)}.critical{fill:var(--emphasis-primary)}.phase{fill:var(--surface-secondary)}.dep{fill:none;stroke:var(--connector);stroke-width:1.5;marker-end:url(#mobile-launch-arrow)}</style><marker id="mobile-launch-arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="var(--connector)"/></marker></defs><rect width="1200" height="760" fill="var(--canvas)"/><text x="52" y="60" class="t">Mobile launch plan</text><text x="52" y="90" class="s">Inclusive dates · weekly scale · exact bars from 1 Sep to 30 Oct 2026</text><rect x="40" y="130" width="1120" height="105" class="phase"/><rect x="40" y="340" width="1120" height="170" class="phase"/><rect x="40" y="550" width="1120" height="115" class="phase"/><text x="52" y="155" class="l">DISCOVERY</text><text x="52" y="365" class="l">DELIVERY</text><text x="52" y="575" class="l">LAUNCH</text><g><path d="M360 115V690M448.67 115V690M537.33 115V690M626 115V690M714.67 115V690M803.33 115V690M892 115V690M980.67 115V690M1069.33 115V690M1120 115V690" class="grid"/><text x="360" y="112" class="s">1 Sep</text><text x="448.67" y="112" class="s">8 Sep</text><text x="537.33" y="112" class="s">15 Sep</text><text x="626" y="112" class="s">22 Sep</text><text x="714.67" y="112" class="s">29 Sep</text><text x="803.33" y="112" class="s">6 Oct</text><text x="892" y="112" class="s">13 Oct</text><text x="980.67" y="112" class="s">20 Oct</text><text x="1069.33" y="112" class="s">27 Oct</text></g><g><text x="55" y="195" class="l">User research</text><rect x="360" y="175" width="88.67" height="28" rx="3" class="done"/><text x="55" y="225" class="l">Confirm scope</text><rect x="448.67" y="205" width="50.67" height="28" rx="3" class="bar"/><text x="55" y="405" class="l">Build application</text><rect x="524.67" y="385" width="240.67" height="28" rx="3" class="critical" data-emphasis="primary"/><text x="55" y="465" class="l">Acceptance testing</text><rect x="790.67" y="445" width="152" height="28" rx="3" class="bar"/><text x="55" y="615" class="l">Store review</text><rect x="968" y="595" width="114" height="28" rx="3" class="bar"/><text x="55" y="650" class="l">Public launch</text><path d="M1113.67 630l12 12-12 12-12-12Z" fill="var(--emphasis-secondary)"/><text x="980" y="650" class="s">30 Oct milestone</text></g><path d="M448.67 189H465V219H448.67M499.34 219H514V399H524.67M765.34 399H780V459H790.67M942.67 459H955V609H968M1082 609H1090V642H1101.67" class="dep"/><text x="52" y="720" class="s">Diamond = milestone · cobalt bar = dependency-supported critical emphasis</text></svg>
