<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>token refresh</title><style>*{box-sizing:border-box}body{margin:0;background:#171a21}svg{display:block;width:100%;height:auto}</style></head><body>
<svg id="token-refresh-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="token-refresh-title token-refresh-desc"><title id="token-refresh-title">Login and token refresh sequence</title><desc id="token-refresh-desc">The User opens an account in the Client app. The Protected API returns token expired, so a bounded exception fragment shows the Client refreshing with the Identity provider, retrying once, and receiving account data.</desc><defs><style>:root{--canvas:#171a21;--surface:#20242c;--surface-secondary:#292e38;--ink:#f4f1e9;--ink-muted:#bcc3d1;--rule:#4d5564;--connector:#aeb7c7;--emphasis-primary:#9cb2ff;--emphasis-primary-tint:#29355c;--emphasis-secondary:#72d3b7;--external:#8ac5fa;--success:#72d3b7;--warning:#f1b36c;--danger:#ff9aa1;--deprecated:#e4b06d}.t{font:36px Georgia;fill:var(--ink)}.s{font:15px Arial;fill:var(--ink-muted)}.p{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.pf{fill:var(--emphasis-primary-tint);stroke:var(--emphasis-primary);stroke-width:2}.l{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:5 5}.m{stroke:var(--connector);stroke-width:2;marker-end:url(#token-refresh-arrow)}.r{stroke:var(--connector);stroke-width:2;stroke-dasharray:7 5;marker-end:url(#token-refresh-open)}.n{font:600 14px Arial;fill:var(--ink);text-anchor:middle}.x{font:13px Arial;fill:var(--ink)}.frag{fill:none;stroke:var(--danger);stroke-width:2;stroke-dasharray:9 5}</style><marker id="token-refresh-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--connector)"/></marker><marker id="token-refresh-open" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--connector)"/></marker></defs><rect width="1200" height="820" fill="var(--canvas)"/><text x="56" y="60" class="t">Login and token refresh</text><text x="56" y="89" class="s">An expired token triggers one guarded refresh and retry.</text><g><rect x="70" y="120" width="170" height="56" rx="6" class="p"/><text x="155" y="154" class="n">User</text><rect x="350" y="120" width="180" height="56" rx="6" class="pf"/><text x="440" y="154" class="n">Client app</text><rect x="660" y="120" width="180" height="56" rx="6" class="p"/><text x="750" y="154" class="n">Protected API</text><rect x="940" y="120" width="200" height="56" rx="6" class="p"/><text x="1040" y="154" class="n">Identity provider</text><path d="M155 176V755M440 176V755M750 176V755M1040 176V755" class="l"/></g><path d="M155 220H440" class="m"/><text x="260" y="211" class="x">1 · Open account</text><path d="M440 275H750" class="m"/><text x="545" y="266" class="x">2 · Request with access token</text><path d="M750 330H440" class="r"/><text x="550" y="321" class="x">3 · 401 token expired</text><rect x="315" y="355" width="785" height="260" rx="4" class="frag"/><path d="M315 390H535L510 418H315Z" fill="var(--danger)"/><text x="330" y="409" class="n" style="text-anchor:start;fill:var(--canvas)">EXCEPTION · token expired</text><text x="330" y="444" class="x">[access token expired; refresh token valid]</text><path d="M440 475H1040" class="m" data-emphasis="primary"/><text x="690" y="466" class="x">4 · Refresh token</text><path d="M1040 525H440" class="r"/><text x="690" y="516" class="x">5 · New access token</text><path d="M440 580H750" class="m" data-emphasis="primary"/><text x="555" y="571" class="x">6 · Retry once</text><path d="M750 655H440" class="r"/><text x="560" y="646" class="x">7 · Account data</text><path d="M440 710H155" class="r"/><text x="260" y="701" class="x">8 · Show account</text><text x="56" y="790" class="s">Dashed open arrows = returns · bounded labelled region = exception path</text></svg>
</body></html>
