name: Release check

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    # Reviewed PNG baselines are platform-sensitive. Use the macOS/arm64 rendering family used
    # for explicit maintainer review.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install chromium
      - run: ruff check .
      - run: python scripts/release_check.py
      - run: DIAGRAMMATICAL_PLAYWRIGHT=1 pytest -q tests/test_export.py
      - run: python scripts/visual_regression.py
