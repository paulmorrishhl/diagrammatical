[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrammatical"
version = "0.1.0"
description = "A specialist diagram designer for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Morrish" }]
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4,<5",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
export = ["playwright>=1.50,<2"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "playwright>=1.50,<2",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
