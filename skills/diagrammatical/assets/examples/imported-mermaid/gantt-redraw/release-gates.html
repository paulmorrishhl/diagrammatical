<svg id="release-gates-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="release-gates-title release-gates-desc"><title id="release-gates-title">Release readiness gates</title><desc id="release-gates-desc">An inclusive monthly plan from March through June 2027 foregrounds three exact milestones: Feature complete on 2 April, Release approval on 21 May, and General availability on 30 June. Supporting evidence and pilot bars lead to those gates.</desc><defs><style>:root{--canvas:#f7f5ef;--surface:#fff;--surface-secondary:#f0eee8;--ink:#20242c;--ink-muted:#687083;--rule:#d8d4ca;--connector:#697386;--emphasis-primary:#315be8;--emphasis-primary-tint:#e7ecff;--emphasis-secondary:#19735e;--external:#2767b0;--success:#19735e;--warning:#b86514;--danger:#b83a42;--deprecated:#9a6427}.t{font:38px Georgia;fill:var(--ink)}.s{font:13px Arial;fill:var(--ink-muted)}.l{font:600 14px Arial;fill:var(--ink)}.grid{stroke:var(--rule);stroke-width:1}.bar{fill:var(--connector)}.critical{fill:var(--emphasis-primary)}.dep{fill:none;stroke:var(--connector);stroke-width:1.5;marker-end:url(#release-gates-arrow)}.gate{fill:var(--surface);stroke:var(--emphasis-secondary);stroke-width:3}</style><marker id="release-gates-arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="var(--connector)"/></marker></defs><rect width="1200" height="760" fill="var(--canvas)"/><text x="52" y="60" class="t">Release readiness gates</text><text x="52" y="90" class="s">Three dated commitments organise the release narrative.</text><path d="M360 125V675M553.11 125V675M740 125V675M933.11 125V675M1120 125V675" class="grid"/><text x="360" y="118" class="s">Mar 2027</text><text x="553.11" y="118" class="s">Apr</text><text x="740" y="118" class="s">May</text><text x="933.11" y="118" class="s">Jun</text><g><text x="52" y="200" class="l">Complete priority features</text><rect x="360" y="180" width="205.57" height="30" rx="3" class="bar"/><text x="52" y="285" class="l">Feature complete</text><path d="M562.45 250l15 15-15 15-15-15Z" class="gate"/><text x="590" y="270" class="s">2 Apr</text><text x="52" y="375" class="l">Security and reliability evidence</text><rect x="578.03" y="355" width="249.18" height="30" rx="3" class="critical" data-emphasis="primary"/><text x="52" y="460" class="l">Release approval</text><path d="M867.7 425l15 15-15 15-15-15Z" class="gate"/><text x="895" y="445" class="s">21 May</text><text x="52" y="550" class="l">Pilot rollout</text><rect x="883.28" y="530" width="161.97" height="30" rx="3" class="bar"/><text x="52" y="640" class="l">General availability</text><path d="M1116.89 605l17 17-17 17-17-17Z" class="gate"/><text x="990" y="650" class="s">30 Jun</text></g><path d="M565.57 195V240H562.45M562.45 280V370H578.03M827.21 370H845V440H852.7M867.7 455V545H883.28M1045.25 545H1070V622H1099.89" class="dep"/><text x="52" y="708" class="s">Diamonds = zero-elapsed-duration milestones on exact inclusive dates · cobalt = critical evidence task</text></svg>
