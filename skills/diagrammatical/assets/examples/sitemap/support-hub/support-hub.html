<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>support hub</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef}svg{display:block;width:100%;height:auto}</style></head><body>
<svg id="support-hub-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="support-hub-title support-hub-desc"><title id="support-hub-title">Support navigation hub</title><desc id="support-hub-desc">Support hub is centred as the root. Three radial branches lead to Learn and Documentation, Troubleshoot and Diagnostics, or authenticated Contact support and Submit ticket. A dashed escalation cross-link runs from Diagnostics to Submit ticket.</desc><defs><style>:root{--canvas:#f7f5ef;--surface:#fff;--surface-secondary:#f0eee8;--ink:#20242c;--ink-muted:#687083;--rule:#d8d4ca;--connector:#697386;--emphasis-primary:#315be8;--emphasis-primary-tint:#e7ecff;--emphasis-secondary:#19735e;--external:#2767b0;--success:#19735e;--warning:#b86514;--danger:#b83a42;--deprecated:#9a6427}.t{font:38px Georgia;fill:var(--ink)}.s{font:14px Arial;fill:var(--ink-muted)}.n{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.f{fill:var(--emphasis-primary-tint);stroke:var(--emphasis-primary);stroke-width:3}.h{fill:none;stroke:var(--connector);stroke-width:2}.c{fill:none;stroke:var(--external);stroke-width:2;stroke-dasharray:8 5;marker-end:url(#support-hub-arrow)}.l{font:600 14px Arial;fill:var(--ink);text-anchor:middle}.r{font:12px Arial;fill:var(--ink-muted);text-anchor:middle}</style><marker id="support-hub-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--external)"/></marker></defs><rect width="1200" height="760" fill="var(--canvas)"/><text x="56" y="62" class="t">Support navigation hub</text><text x="56" y="91" class="s">Three routes radiate from one support entry point; escalation remains explicit.</text><path d="M290 360L420 240M290 360H420M290 360L420 485M580 240H900M580 360H900M580 485H900" class="h"/><g data-emphasis="primary"><circle cx="200" cy="360" r="90" class="f"/><text x="200" y="353" class="l">Support hub</text><text x="200" y="378" class="r">/support</text></g>
