<svg id="product-areas-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="product-areas-title product-areas-desc"><title id="product-areas-title">Signed-in product areas</title><desc id="product-areas-desc">The authenticated Workspace shell is the root. Three bounded product areas—Work, Insights and Administration—contain two screens each. Reports is visibly labelled planned, and a dotted cross-link opens a project from Dashboard.</desc><defs><style>:root{--canvas:#171a21;--surface:#20242c;--surface-secondary:#292e38;--ink:#f4f1e9;--ink-muted:#bcc3d1;--rule:#4d5564;--connector:#aeb7c7;--emphasis-primary:#9cb2ff;--emphasis-primary-tint:#29355c;--emphasis-secondary:#72d3b7;--external:#8ac5fa;--success:#72d3b7;--warning:#f1b36c;--danger:#ff9aa1;--deprecated:#e4b06d}.t{font:36px Georgia;fill:var(--ink)}.s{font:14px Arial;fill:var(--ink-muted)}.g{fill:var(--surface-secondary);stroke:var(--rule);stroke-width:1}.n{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.f{fill:var(--emphasis-primary-tint);stroke:var(--emphasis-primary);stroke-width:2.5}.h{fill:none;stroke:var(--connector);stroke-width:2}.c{fill:none;stroke:var(--external);stroke-width:2;stroke-dasharray:2 6;marker-end:url(#product-areas-arrow)}.l{font:600 14px Arial;fill:var(--ink);text-anchor:middle}.r{font:12px monospace;fill:var(--ink-muted);text-anchor:middle}</style><marker id="product-areas-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--external)"/></marker></defs><rect width="1200" height="800" fill="var(--canvas)"/><text x="56" y="62" class="t">Signed-in product areas</text><text x="56" y="91" class="s">The authenticated shell groups three stable areas; planned status uses text and dash.</text><path d="M600 185V250M220 250H980M220 250V300M600 250V300M980 250V300" class="h"/><rect x="60" y="280" width="320" height="380" rx="10" class="g"/><rect x="440" y="280" width="320" height="380" rx="10" class="g"/><rect x="820" y="280" width="320" height="380" rx="10" class="g"/><g data-emphasis="primary"><rect x="485" y="120" width="230" height="65" rx="6" class="f"/><text x="600" y="148" class="l">Workspace · authenticated</text><text x="600" y="171" class="r">/app</text></g><g><rect x="120" y="315" width="200" height="58" rx="6" class="n"/><text x="220" y="350" class="l">Work</text><path d="M220 373V425M145 425H295M145 425V460M295 425V460" class="h"/><rect x="85" y="460" width="120" height="70" rx="6" class="n"/><text x="145" y="500" class="l">My queue</text><rect x="235" y="460" width="120" height="70" rx="6" class="n"/><text x="295" y="500" class="l">Projects</text><rect x="500" y="315" width="200" height="58" rx="6" class="n"/><text x="600" y="350" class="l">Insights</text><path d="M600 373V425M525 425H675M525 425V460M675 425V460" class="h"/><rect x="465" y="460" width="120" height="70" rx="6" class="n"/><text x="525" y="500" class="l">Dashboard</text><rect x="615" y="460" width="120" height="70" rx="6" fill="var(--surface)" stroke="var(--warning)" stroke-width="2" stroke-dasharray="7 4"/><text x="675" y="492" class="l">Reports</text><text x="675" y="516" class="r">PLANNED</text><rect x="880" y="315" width="200" height="58" rx="6" class="n"/><text x="980" y="350" class="l">Administration</text><path d="M980 373V425M905 425H1055M905 425V460M1055 425V460" class="h"/><rect x="845" y="460" width="120" height="70" rx="6" class="n"/><text x="905" y="500" class="l">People</text><rect x="995" y="460" width="120" height="70" rx="6" class="n"/><text x="1055" y="500" class="l">Settings</text></g><path d="M525 530C470 605 355 600 295 530" class="c"/><text x="365" y="596" class="s">Open project · cross-link</text><text x="56" y="750" class="s">Solid links = hierarchy · dotted labelled link = cross-navigation</text></svg>
